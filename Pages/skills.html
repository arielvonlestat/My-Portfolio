<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Skills</title>
    <link
      rel="icon"
      type="image/png"
      sizes="32x32"
      href="../Assets/Images/cow.png"
    />
    <link rel="stylesheet" href="../CSS/reset.css" />
    <link rel="stylesheet" href="../CSS/styles.css" />
    <link rel="stylesheet" href="../CSS/skills.css" />
    <script src="../JS/app.js" defer></script>
  </head>
  <body id="skills-page">
    <div class="skills-page">
      <h1>Skills</h1>

      <div id="skill-boxes">
        <div id="html-css" class="skill-boxes">
          <div class="skill-box-text">
            <h2>HTML & CSS</h2>
            <p>Structure, styling, responsive layouts, & accessibility.</p>
          </div>
          <div class="skill-box-images">
            <img src="../Assets/Images/HTML.png" alt="" />
            <img src="../Assets/Images/CSS.png" alt="" />
          </div>
        </div>
        <div id="javascript" class="skill-boxes">
          <div class="skill-box-text">
            <h2>JAVASCRIPT</h2>
            <p>Interactive functionality, logic, & DOM manipulation.</p>
          </div>
          <img src="../Assets/Images/JS.png" alt="" />
        </div>
        <div id="git-github" class="skill-boxes">
          <div class="skill-box-text">
            <h2>GIT & GITHUB</h2>
            <p>Version control & project management.</p>
          </div>
          <div class="skill-box-images">
            <img src="../Assets/Images/GIT.png" alt="" />
            <img src="../Assets/Images/github.png" alt="" />
          </div>
        </div>
        <div id="figma" class="skill-boxes">
          <div class="skill-box-text">
            <h2>FIGMA</h2>
            <p>Design exploration and translating designs into code.</p>
          </div>
          <img src="../Assets/Images/FIGMA.png" alt="" />
        </div>
      </div>
    </div>
  </body>
</html>
